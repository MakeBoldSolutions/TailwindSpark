<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwind Demo</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // Security: This script only redirects within the same origin
      var pathSegmentsToKeep = 1;

      var l = window.location;
      var newUrl =
        l.protocol +
        '//' +
        l.hostname +
        (l.port ? ':' + l.port : '') +
        l.pathname
          .split('/')
          .slice(0, 1 + pathSegmentsToKeep)
          .join('/') +
        '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;

      // Validate that the redirect stays within the same origin before redirecting
      try {
        var targetUrl = new URL(newUrl);
        if (targetUrl.origin === window.location.origin) {
          window.location.replace(newUrl);
        }
      } catch (e) {
        // If URL parsing fails, redirect to root as fallback
        window.location.replace('/');
      }
    </script>
  </head>
  <body></body>
</html>
