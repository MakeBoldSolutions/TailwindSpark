    <script>
      (function () {
        var storageKey = 'tailwindspark:theme-preference';
        var legacyKey = 'theme';
        var themes = ['material', 'minimal', 'brutalist'];
        var modes = ['light', 'dark'];
        var root = document.documentElement;
        var preference = {
          themeId: 'material',
          mode:
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light',
        };

        function isValidTheme(value) {
          return themes.indexOf(value) !== -1;
        }

        function isValidMode(value) {
          return modes.indexOf(value) !== -1;
        }

        try {
          var rawPreference = localStorage.getItem(storageKey);
          if (rawPreference) {
            var parsedPreference = JSON.parse(rawPreference);
            if (parsedPreference && isValidTheme(parsedPreference.themeId) && isValidMode(parsedPreference.mode)) {
              preference = {
                themeId: parsedPreference.themeId,
                mode: parsedPreference.mode,
              };
            }
          } else {
            var legacyMode = localStorage.getItem(legacyKey);
            if (isValidMode(legacyMode)) {
              preference.mode = legacyMode;
            }
          }
        } catch {
          // Ignore malformed stored preferences and fall back to defaults.
        }

        root.dataset.theme = preference.themeId;
        root.dataset.themeMode = preference.mode;
        root.classList.toggle('dark', preference.mode === 'dark');
        root.style.colorScheme = preference.mode;
        window.__TAILWINDSPARK_THEME__ = preference;
      })();
    </script>

    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
